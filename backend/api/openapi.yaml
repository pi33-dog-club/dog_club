components:
    headers:
        NoStore:
            required: true
            schema:
                const: no-store
                type: string
        RequestID:
            description: Идентификатор запроса, совпадающий с request_id в логах и ошибке
            required: true
            schema:
                minLength: 1
                type: string
    responses:
        BreedingConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Версия или состояние изменились; вся операция откатывается.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BreedingUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Племенное хранилище временно недоступно.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthBadToken:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Одноразовый код недействителен, использован или просрочен
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Дубликат, несовместимое состояние или попытка отключить последнего администратора
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthForbidden:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Профиль отключён, не выбран для операции, не принадлежит пользователю либо запрещён источник браузерного запроса
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthRateLimited:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Превышен лимит попыток или заняты слоты проверки пароля
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                Retry-After:
                    required: true
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthUnauthorized:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Неверные учётные данные, недействительный JWT или отозванная сессия
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                WWW-Authenticate:
                    required: true
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: PostgreSQL или отправка почты недоступны; при отказе почты приглашение сохранено. Location указывает маршрут повторной отправки
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                Location:
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BadRequest:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Некорректный JSON, неизвестные поля, неверные типы значений либо недействительный одноразовый код активации/восстановления
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BodyTooLarge:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Превышен допустимый размер тела запроса
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        DogConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Устаревшая версия, повторный глобальный идентификатор или уже записанный титул; транзакция откатывается целиком.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        DogsUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Сервис учёта собак временно недоступен.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        InternalError:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Внутренняя ошибка, подробности клиенту не раскрываются
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MemberConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Версия карточки устарела либо адрес используется мероприятием. При ошибке данные и история не меняются.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MembersUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Сервис карточек временно недоступен.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MethodNotAllowed:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Метод не поддерживается для этого маршрута
            headers:
                Allow:
                    required: true
                    schema:
                        minLength: 1
                        type: string
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        NotFound:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ресурс или маршрут не найден
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        UnsupportedMediaType:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ожидается application/json в UTF-8
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        ValidationFailed:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Некорректные значения полей; массив errors может содержать подробности
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        VeterinaryConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Устаревшая версия или запись уже отмечена недействительной. Все изменения транзакции откатываются.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        VeterinaryUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ветеринарное хранилище временно недоступно.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        EventConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Конфликт версии, состояния, дубликат участия или попытка изменить зафиксированный факт.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        EventsUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Учёт мероприятий временно недоступен.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
    schemas:
        OperationsMetrics:
            type: object
            additionalProperties: false
            required: [uptime_seconds, http, database, notifications_enabled, notifications]
            properties:
                uptime_seconds:
                    type: number
                    minimum: 0
                notifications_enabled:
                    type: boolean
                http:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        required: [method, route, requests, client_errors, server_errors, duration_seconds, max_duration_seconds]
                        properties:
                            method: {type: string}
                            route: {type: string}
                            requests: {type: integer, minimum: 0}
                            client_errors: {type: integer, minimum: 0}
                            server_errors: {type: integer, minimum: 0}
                            duration_seconds: {type: number, minimum: 0}
                            max_duration_seconds: {type: number, minimum: 0}
                database:
                    type: object
                    additionalProperties: false
                    required: [total_connections, acquired_connections, idle_connections, max_connections, acquire_count, acquire_duration_seconds, canceled_acquire_count]
                    properties:
                        total_connections: {type: integer, minimum: 0}
                        acquired_connections: {type: integer, minimum: 0}
                        idle_connections: {type: integer, minimum: 0}
                        max_connections: {type: integer, minimum: 1}
                        acquire_count: {type: integer, minimum: 0}
                        acquire_duration_seconds: {type: number, minimum: 0}
                        canceled_acquire_count: {type: integer, minimum: 0}
                notifications:
                    type: object
                    additionalProperties: false
                    required: [pending, sending, sent, suppressed, last_successful_cycle_unix]
                    properties:
                        pending: {type: integer, minimum: 0}
                        sending: {type: integer, minimum: 0}
                        sent: {type: integer, minimum: 0}
                        suppressed: {type: integer, minimum: 0}
                        last_successful_cycle_unix: {type: integer, minimum: 0}

        BreedingAnimal:
            additionalProperties: false
            properties:
                ancestor_ids:
                    items:
                        format: int32
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                    type: array
                    uniqueItems: true
                ancestry_incomplete:
                    type: boolean
                breed:
                    $ref: '#/components/schemas/DogDictionary'
                coat_color:
                    $ref: '#/components/schemas/DogDictionary'
                date_of_birth:
                    format: date
                    type: string
                height_cm:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
                id:
                    format: int32
                    minimum: 1
                    type: integer
                identifier:
                    $ref: '#/components/schemas/DogIdentifier'
                nickname:
                    maxLength: 100
                    minLength: 1
                    type: string
                pedigree:
                    $ref: '#/components/schemas/DogPedigree'
                pedigree_known_3_generations:
                    description: Заполнены номер и организация документа родословной, либо родители и деды — карточки клуба, а все прадеды известны. Отсутствует в снимках до версии 0.11.
                    type: boolean
                sex:
                    $ref: '#/components/schemas/DogDictionary'
                status:
                    $ref: '#/components/schemas/DogDictionary'
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
                weight_kg:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
            required:
                - pedigree
                - ancestor_ids
                - ancestry_incomplete
                - id
                - nickname
                - date_of_birth
                - identifier
                - status
                - breed
                - coat_color
                - sex
                - height_cm
                - weight_kg
                - version
            type: object
        BreedingMateCandidates:
            additionalProperties: false
            properties:
                as_of:
                    format: date
                    type: string
                candidates:
                    items:
                        $ref: '#/components/schemas/DogSummary'
                    type: array
                dog_id:
                    format: int32
                    minimum: 1
                    type: integer
                truncated:
                    description: true — под SQL-фильтр попало больше 500 собак; проверены первые 500 по ID.
                    type: boolean
            required:
                - dog_id
                - as_of
                - candidates
                - truncated
            type: object
        BreedingAssessment:
            additionalProperties: false
            properties:
                as_of:
                    format: date
                    type: string
                blocking_reasons:
                    items:
                        enum:
                            - same_dog
                            - female_inactive
                            - male_inactive
                            - pair_sex
                            - different_breeds
                            - pair_birth_dates
                            - identifier_missing
                            - female_medical_clearance
                            - male_medical_clearance
                            - parent_child
                            - shared_parent
                            - common_ancestor_3_generations
                            - expected_birth_date_required
                            - litter_interval
                            - expected_birth_before_mating
                            - previous_outcome_unknown
                            - another_approved_request
                        type: string
                    type: array
                common_ancestor_ids:
                    items:
                        format: int32
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                    type: array
                    uniqueItems: true
                earliest_birth_date:
                    format: date
                    type:
                        - string
                        - "null"
                female:
                    $ref: '#/components/schemas/BreedingAnimal'
                female_health:
                    $ref: '#/components/schemas/BreedingHealth'
                interval_days:
                    const: 365
                    type: integer
                male:
                    $ref: '#/components/schemas/BreedingAnimal'
                male_health:
                    $ref: '#/components/schemas/BreedingHealth'
                warnings:
                    items:
                        enum:
                            - known_relationship
                            - ancestry_incomplete
                            - hereditary_findings_require_expert
                            - earlier_litters_not_recorded
                        type: string
                    type: array
            required:
                - as_of
                - female
                - male
                - female_health
                - male_health
                - common_ancestor_ids
                - earliest_birth_date
                - blocking_reasons
                - warnings
                - interval_days
            type: object
        BreedingChange:
            additionalProperties: false
            properties:
                action:
                    type: string
                actor_profile_id:
                    type: string
                actor_user_id:
                    type: string
                after:
                    anyOf:
                        - type: object
                        - type: "null"
                before:
                    anyOf:
                        - type: object
                        - type: "null"
                changed_at:
                    format: date-time
                    type: string
                entity:
                    enum:
                        - request
                        - breeding
                        - litter
                    type: string
                entity_id:
                    format: int64
                    minimum: 1
                    type: integer
                id:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    type: string
                request_id:
                    type: string
            required:
                - id
                - entity
                - entity_id
                - actor_user_id
                - actor_profile_id
                - action
                - reason
                - before
                - after
                - request_id
                - changed_at
            type: object
        BreedingChangePage:
            additionalProperties: false
            properties:
                next_after:
                    format: int64
                    minimum: 1
                    type:
                        - integer
                        - "null"
                records:
                    items:
                        $ref: '#/components/schemas/BreedingChange'
                    type: array
            required:
                - records
                - next_after
            type: object
        BreedingCorrection:
            additionalProperties: false
            properties:
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
            type: object
        BreedingDecision:
            additionalProperties: false
            properties:
                actor_profile_id:
                    type: string
                actor_user_id:
                    type: string
                assessment:
                    anyOf:
                        - $ref: '#/components/schemas/BreedingAssessment'
                        - type: "null"
                decided_at:
                    format: date-time
                    type: string
                decision:
                    enum:
                        - approved
                        - rejected
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    type: string
                request_id:
                    format: int64
                    minimum: 1
                    type: integer
                request_version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - request_id
                - request_version
                - decision
                - reason
                - assessment
                - actor_user_id
                - actor_profile_id
                - decided_at
            type: object
        BreedingDecisionInput:
            additionalProperties: false
            properties:
                decision:
                    enum:
                        - approved
                        - rejected
                    type: string
                expected_birth_date:
                    format: date
                    type:
                        - string
                        - "null"
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
                - decision
            type: object
        BreedingDecisionPage:
            additionalProperties: false
            properties:
                next_after:
                    format: int64
                    minimum: 1
                    type:
                        - integer
                        - "null"
                records:
                    items:
                        $ref: '#/components/schemas/BreedingDecision'
                    type: array
            required:
                - records
                - next_after
            type: object
        BreedingFinding:
            additionalProperties: false
            properties:
                date:
                    format: date
                    type: string
                disease_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                disease_name:
                    type: string
                examination_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                is_hereditary:
                    type:
                        - boolean
                        - "null"
            required:
                - examination_id
                - date
                - disease_id
                - disease_name
                - is_hereditary
            type: object
        BreedingHealth:
            additionalProperties: false
            properties:
                admission:
                    $ref: '#/components/schemas/MedicalAdmission'
                as_of:
                    format: date
                    type: string
                findings:
                    items:
                        $ref: '#/components/schemas/BreedingFinding'
                    type: array
            required:
                - as_of
                - admission
                - findings
            type: object
        BreedingLinkInput:
            additionalProperties: false
            properties:
                dog_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                dog_version:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
                - dog_id
                - dog_version
            type: object
        BreedingLitter:
            additionalProperties: false
            properties:
                breeding_id:
                    format: int64
                    minimum: 1
                    type: integer
                date_of_birth:
                    format: date
                    type: string
                dog_ids:
                    items:
                        format: int32
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                    type: array
                    uniqueItems: true
                female_dog_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                id:
                    format: int64
                    minimum: 1
                    type: integer
                interval_days:
                    format: int32
                    minimum: 0
                    type:
                        - integer
                        - "null"
                interval_violation:
                    type: boolean
                male_dog_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                previous_birth_date:
                    format: date
                    type:
                        - string
                        - "null"
                total_puppies:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - breeding_id
                - female_dog_id
                - male_dog_id
                - date_of_birth
                - total_puppies
                - dog_ids
                - previous_birth_date
                - interval_days
                - interval_violation
                - version
            type: object
        BreedingLitterInput:
            additionalProperties: false
            properties:
                breeding_id:
                    format: int64
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                date_of_birth:
                    format: date
                    type: string
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                total_puppies:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
                - breeding_id
                - date_of_birth
                - total_puppies
            type: object
        BreedingLitterPage:
            additionalProperties: false
            properties:
                next_after:
                    format: int64
                    minimum: 1
                    type:
                        - integer
                        - "null"
                records:
                    items:
                        $ref: '#/components/schemas/BreedingLitter'
                    type: array
            required:
                - records
                - next_after
            type: object
        BreedingLitterUpdate:
            additionalProperties: false
            properties:
                date_of_birth:
                    format: date
                    type: string
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                total_puppies:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
                - date_of_birth
                - total_puppies
            type: object
        BreedingMating:
            additionalProperties: false
            properties:
                assessment:
                    anyOf:
                        - $ref: '#/components/schemas/BreedingAssessment'
                        - type: "null"
                date:
                    format: date
                    type:
                        - string
                        - "null"
                female_dog_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                id:
                    format: int64
                    minimum: 1
                    type: integer
                legacy_puppy_count:
                    format: int32
                    type:
                        - integer
                        - "null"
                male_dog_id:
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                outcome:
                    enum:
                        - unknown
                        - no_litter
                        - litter
                    type: string
                request_id:
                    format: int64
                    minimum: 1
                    type:
                        - integer
                        - "null"
                status:
                    $ref: '#/components/schemas/DogDictionary'
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - request_id
                - female_dog_id
                - male_dog_id
                - date
                - status
                - outcome
                - legacy_puppy_count
                - assessment
                - version
            type: object
        BreedingMatingInput:
            additionalProperties: false
            properties:
                date:
                    format: date
                    type: string
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                version:
                    format: int64
